[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "culture-materials"
version = "1.0.0"
description = "数字文化馆素材整理命令行工具"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Digital Culture Center"}]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "tqdm>=4.65.0",
    "SQLAlchemy>=2.0.0",
    "Pillow>=10.0.0",
    "filetype>=1.2.0",
    "pydub>=0.25.1",
    "PyPDF2>=3.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "mutagen>=1.47.0",
    "python-slugify>=8.0.0",
    "jinja2>=3.1.0",
]

[project.scripts]
cultmat = "cultmat.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cultmat*"]
